# Pour rendre ce check bloquant : Settings → Branches → main → Add rule → Require status checks to pass before merging → Cocher "Security Scan / python-audit", "Security Scan / npm-audit", "Security Scan / image-scan".
# Sans cette config, les checks tournent mais n'empêchent pas le merge.

name: Security Scan

on: [push, pull_request]

jobs:
  python-audit:
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      - run: |
          PIP_AUDIT_IGNORE_ARGS="$(grep -Ev '^\s*(#|$)' backend/pip-audit-ignore.txt | sed 's/^/--ignore-vuln /' | tr '\n' ' ')"
          if [ -f backend/requirements.lock ]; then
            pip-audit -r backend/requirements.lock --skip-editable $PIP_AUDIT_IGNORE_ARGS
          else
            pip-audit -r backend/requirements.txt --skip-editable $PIP_AUDIT_IGNORE_ARGS
          fi

  npm-audit:
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: cd frontend && npm ci --legacy-peer-deps
      - run: cd frontend && npm audit --audit-level=high

  image-scan:
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v7
      - name: Build backend image
        run: docker build -t privacy-proxy-backend:scan ./backend
      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "privacy-proxy-backend:scan"
          severity: "HIGH,CRITICAL"
          exit-code: 1
          ignore-unfixed: true
