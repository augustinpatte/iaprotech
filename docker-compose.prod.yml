version: "3.9"

# ============================================================
# Privacy Proxy — Docker Compose PRODUCTION
# Domaine : iaprotech.com / api.iaprotech.com
# ============================================================

services:
  # ----------------------------------------------------------
  # Backend — FastAPI + Presidio
  # ----------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: "2"
    env_file: .env.prod
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    networks:
      - proxy_net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 3

  # ----------------------------------------------------------
  # Frontend — React (Vite build statique servi par Nginx interne)
  # VITE_API_URL est injecté au moment du build (ARG Docker)
  # ----------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=https://api.iaprotech.com
    restart: always
    networks:
      - proxy_net

  # ----------------------------------------------------------
  # Redis — vault PII chiffré, AOF activé, LRU si plein
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - proxy_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # Nginx — reverse proxy public (HTTP→HTTPS, SSL Let's Encrypt)
  # ----------------------------------------------------------
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - nginx_cache:/var/cache/nginx
    networks:
      - proxy_net
    depends_on:
      - frontend
      - backend

# ----------------------------------------------------------
# Réseau privé — backend et redis non exposés directement
# ----------------------------------------------------------
networks:
  proxy_net:
    driver: bridge

# ----------------------------------------------------------
# Volumes persistants
# ----------------------------------------------------------
volumes:
  redis_data:
  nginx_cache:
