server {
    listen 3000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Security headers (OWASP Secure Headers Project)
    add_header X-Content-Type-Options    "nosniff"                          always;
    add_header X-Frame-Options           "DENY"                             always;
    add_header X-XSS-Protection          "1; mode=block"                    always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"  always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    # HSTS (activer en production HTTPS uniquement)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Content Security Policy
    # ${API_URL} est injecte par envsubst au demarrage du conteneur (voir Dockerfile CMD).
    # Pour changer l'URL de l'API en production, definir la variable d'env API_URL.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ${API_URL}; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # React Router - redirige tout vers index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache assets statiques (hashes dans les noms de fichiers Vite)
    location /assets {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health check
    location /health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
