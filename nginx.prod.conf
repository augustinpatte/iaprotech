# ============================================================
# Nginx PRODUCTION — iaprotech.com
# - HTTP  → HTTPS redirect (80 → 443)
# - iaprotech.com       → frontend (React SPA)
# - api.iaprotech.com   → backend  (FastAPI)
# - Rate limiting, gzip, headers de sécurité OWASP
# ============================================================

server_tokens off;

# --- Zones de rate limiting -------------------------------------------
# Zone générale : 10 req/s par IP (rafale de 20)
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
# Zone API : 5 req/s par IP (rafale de 10) — plus restrictive
limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;
# Zone auth : 2 req/s par IP — anti brute-force
limit_req_zone $binary_remote_addr zone=auth:10m rate=2r/s;

# --- Limite de connexions simultanées par IP --------------------------
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

# --- Gzip global -------------------------------------------------------
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml
    application/rss+xml
    application/atom+xml
    image/svg+xml
    font/woff
    font/woff2;

# ======================================================================
# 1. HTTP → HTTPS redirect (tout domaine)
# ======================================================================
server {
    listen 80;
    server_name iaprotech.com www.iaprotech.com api.iaprotech.com;

    limit_conn conn_per_ip 50;

    # Autoriser le renouvellement Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ======================================================================
# 2. FRONTEND — iaprotech.com (React SPA)
# ======================================================================
server {
    listen 443 ssl http2;
    server_name iaprotech.com www.iaprotech.com;

    limit_conn conn_per_ip 50;

    # --- SSL ---
    ssl_certificate     /etc/letsencrypt/live/iaprotech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iaprotech.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/iaprotech.com/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # --- Headers de sécurité OWASP ---
    add_header Strict-Transport-Security  "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options     "nosniff"                                      always;
    add_header X-Frame-Options            "DENY"                                         always;
    add_header X-XSS-Protection           "1; mode=block"                                always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"              always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()"     always;
    add_header Content-Security-Policy    "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://api.iaprotech.com; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests;" always;

    # --- Rate limiting global ---
    limit_req zone=general burst=20 nodelay;
    limit_req_status 429;

    # --- Proxy vers le conteneur frontend ---
    location / {
        proxy_pass         http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # --- Cache assets Vite (hash dans le nom de fichier) ---
    location /assets/ {
        proxy_pass       http://frontend:3000;
        expires          1y;
        add_header Cache-Control "public, immutable";
        access_log       off;
    }

    # --- Health liveness ---
    location /health {
        proxy_pass http://frontend:3000/health;
        access_log off;
    }
}

# ======================================================================
# 3. BACKEND — api.iaprotech.com (FastAPI)
# ======================================================================
server {
    listen 443 ssl http2;
    server_name api.iaprotech.com;

    limit_conn conn_per_ip 50;

    # --- SSL (même certificat wildcard ou certificat dédié) ---
    ssl_certificate     /etc/letsencrypt/live/iaprotech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iaprotech.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/iaprotech.com/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # --- Headers de sécurité ---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"                                      always;
    add_header X-Frame-Options           "DENY"                                         always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;

    # Taille max des uploads (fichiers PDF/DOCX)
    client_max_body_size 20M;

    # --- Rate limiting auth (anti brute-force) ---
    location /api/auth/ {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;

        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # --- Rate limiting API chat (streaming SSE) ---
    location /api/chat {
        limit_conn conn_per_ip 10;
        limit_req zone=api burst=10 nodelay;
        limit_req_status 429;

        proxy_pass             http://backend:8000;
        proxy_http_version     1.1;
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;

        # SSE streaming — pas de buffering
        proxy_buffering        off;
        proxy_cache            off;
        proxy_read_timeout     300s;
        proxy_send_timeout     300s;
        chunked_transfer_encoding on;
    }

    # --- Toutes les autres routes API ---
    location / {
        limit_req zone=api burst=10 nodelay;
        limit_req_status 429;

        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- Health (pas de rate limit) ---
    location /health {
        proxy_pass http://backend:8000/health;
        access_log off;
    }

    # --- Bloquer Swagger en production ---
    location /docs {
        return 403;
    }
    location /redoc {
        return 403;
    }
    location /openapi.json {
        return 403;
    }
}
